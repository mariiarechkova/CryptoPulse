[tool.black]
line-length = 100
target-version = ["py311"]

exclude = '''
(
  /alembic/
| /migrations/
| /infrastructure/db/migrations/
)
'''

[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
  ".venv",
  "venv",
  "__pycache__",
  ".git",
  ".mypy_cache",

  # Alembic / migrations
  "alembic",
  "migrations",

  # файл для регистрации моделей
  "app/db/init_models.py",
  "app/billing/models/__init__.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]