services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - '5432:5432'
    volumes:
      - data-postgres:/var/lib/postgresql/data

  cron:
    build: .
    command: python -m cron.runner
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - postgres


  cryptopulse:
    build: .
#    image: cryptopulse:latest
    command: python run.py
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres


volumes:
  data-postgres:
